name: Weekly data refresh

on:
  schedule:
    - cron: "30 9 * * 1"        # Mondays, about 5:30am Eastern
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install packages
        run: pip install -r pipeline/requirements.txt

      - name: Refit the model on the latest data
        run: python pipeline/update.py --boot 200

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data this week."
          else
            git commit -m "Weekly data refresh $(date -u +%F)"
            git push
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          fi
