name: Daily data refresh

on:
  schedule:
    - cron: "30 9 * * *"        # every day, about 5:30am Eastern (publishes only when the data changed)
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install packages
        run: pip install -r pipeline/requirements.txt

      - name: Restore built seasons
        uses: actions/cache@v4
        with:
          path: |
            pipeline/out/games_*.csv.gz
            pipeline/out/teamgames_*.csv.gz
            pipeline/out/names_*.csv
          key: seasons-${{ github.run_id }}
          restore-keys: seasons-

      - name: Run the season forecast (1,000,000 seasons)
        continue-on-error: true          # if it fails, the forecast page keeps yesterday's numbers
        run: bash pipeline/forecast_update.sh

      - name: Refit the rim protection model
        run: python pipeline/update.py --boot 200

      - name: Rebuild the Load & Durability model
        continue-on-error: true          # if it fails, the rim model still publishes and the injury page keeps its last good data
        run: bash pipeline/load_update.sh

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ -d pipeline/live ]; then git add pipeline/live; fi
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "Data refresh $(date -u +%F)"
            git push
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          fi

      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --assignee TheLowPostHoops --title "Data refresh failed $(date -u +%F)" --body "The daily data refresh failed. The site is still showing the last good data. Details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
